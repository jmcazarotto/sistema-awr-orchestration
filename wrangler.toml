# AWR Design System — Cloudflare
# Fase 1: roda local (Node) e é exposto via Cloudflare Tunnel:  npm run tunnel
# Fase 2: o orquestrador migra para Workers + Durable Objects (1 DO por ator),
#         acervo → R2, estado → D1. Os bindings abaixo ficam comentados até lá.

name = "awr-design-system"
main = "src/server/worker.ts"          # entrypoint Workers (Fase 2)
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Front-end (Cloudflare Pages / Workers Static Assets)
[assets]
directory = "./dist/web"
not_found_handling = "single-page-application"

[vars]
IMAGE_ENGINE_MODE = "mock"
AI_MODE = "mock"
MAX_HOPS = "5"
MAX_DIRECTOR_ATTEMPTS = "3"

